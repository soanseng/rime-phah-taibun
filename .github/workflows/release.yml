name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build verified source payload
        run: |
          mkdir -p packaging/source/build
          git archive --format=zip --output=packaging/source/build/PhahTaiBun-source.zip HEAD \
            schema lua icons rime.lua install.sh install_windows.ps1 \
            scripts/install_linux.sh scripts/install_macos.sh
          cd packaging/source/build
          sha256sum PhahTaiBun-source.zip > PhahTaiBun-source.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: PhahTaiBun-source
          path: |
            packaging/source/build/PhahTaiBun-source.zip
            packaging/source/build/PhahTaiBun-source.zip.sha256
          if-no-files-found: error

  package-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build macOS pkg
        run: |
          PHAH_TAIBUN_VERSION="${GITHUB_REF_NAME#v}" packaging/macos/build-pkg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: PhahTaiBun-macOS-pkg
          path: packaging/macos/build/PhahTaiBun.pkg

  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          $env:PHAH_TAIBUN_VERSION = "${env:GITHUB_REF_NAME}".TrimStart("v")
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging/windows/phah-taibun.iss

      - uses: actions/upload-artifact@v4
        with:
          name: PhahTaiBun-Windows-setup
          path: packaging/windows/Output/PhahTaiBunSetup.exe
          if-no-files-found: error

  release:
    needs: [package-source, package-macos, package-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            release-assets/PhahTaiBun-macOS-pkg/PhahTaiBun.pkg
            release-assets/PhahTaiBun-Windows-setup/PhahTaiBunSetup.exe
            release-assets/PhahTaiBun-source/PhahTaiBun-source.zip
            release-assets/PhahTaiBun-source/PhahTaiBun-source.zip.sha256
