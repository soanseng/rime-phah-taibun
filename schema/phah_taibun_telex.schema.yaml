# Rime schema — 拍台文(Telex) Phah Tâi-bûn Telex
# Advanced input layer for fluent TL/POJ typists: kahiok-style tone keys.
# Shares the main dictionary — Telex spellings are normalized to numeric TL
# keys by lua/phah_taibun_telex.lua before the speller sees them.

schema:
  schema_id: phah_taibun_telex
  name: "拍台文(Telex)"
  version: "0.9.3"
  author:
    - "拍台文開發團隊"
  dependencies:
    - bopomofo_tw
  description: |
    台語輸入法方案（進階）— Telex 調鍵連續輸入
    v=2/8、x=1/4、y=3、d=5、w=7、q=9；z→ts、zh→tsh；f=音節連字符
    與「拍台文(台)」共用詞典、詞頻與使用者詞庫

switches:
  - name: ascii_mode
    reset: 0
    states: [ 台文, ABC ]
  - name: full_shape
    states: [ 半形, 全形 ]
  - name: full_romanization
    states: [ 漢羅, 全羅 ]
  - name: poj_mode
    states: [ TL, POJ ]
  - name: hanlo_manual
    states: [ 自動漢羅, 手動漢羅 ]
  - name: emoji_conversion
    reset: 1
    states: [ "🈚︎", "🈶︎" ]

ascii_composer:
  switch_key:
    Shift_L: noop
    Shift_R: noop
    Caps_Lock: clear

engine:
  processors:
    - lua_processor@*phah_taibun_telex
    - lua_processor@*phah_taibun_input
    - ascii_composer
    - lua_processor@*phah_taibun_select_char
    - recognizer
    - key_binder
    - speller
    - lua_processor@*phah_taibun_commit
    - punctuator
    - selector
    - navigator
    - fluency_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - echo_translator
    - punct_translator
    - script_translator
    - reverse_lookup_translator
    - table_translator@custom_phrase
    - lua_translator@*phah_taibun_help
    - lua_translator@*phah_taibun_date
    - lua_translator@*phah_taibun_symbols
    - lua_translator@*phah_taibun_emoji_menu
    - lua_translator@*phah_taibun_wildcard
    - lua_translator@*phah_taibun_phrase
    - lua_translator@*phah_taibun_speedup
  filters:
    - lua_filter@*phah_taibun_lighttone
    - lua_filter@*phah_taibun_filter
    - lua_filter@*phah_taibun_lookup
    - lua_filter@*phah_taibun_recommend
    - lua_filter@*phah_taibun_synonym
    - lua_filter@*phah_taibun_long_word
    - reverse_lookup_filter@phah_taibun_reverse_lookup
    - lua_filter@*phah_taibun_reverse_format
    - simplifier@emoji_conversion
    - lua_filter@*phah_taibun_origin
    - uniquifier

speller:
  alphabet: "zyxwvutsrqponmlkjihgfedcba1234567890-"
  initials: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '-"
  algebra:
    # === 聲調完全可省略（Telex 調鍵由 Lua 預先轉成數字調） ===
    - derive/[1-9]$//

    # === POJ → TL 對應 ===
    - derive/^ts/ch/
    - derive/^tsh/chh/
    - derive/ing/eng/
    - derive/ik/ek/
    - derive/ua/oa/
    - derive/ue/oe/
    - derive/oo/ou/
    - derive/nn/ⁿ/

    # === POJ 無調拼式（與主方案對齊；直接 derive 避免雙音節切分壓過） ===
    - derive/^ts([a-z]*)ua([a-z]*)[1-9]$/ch$1oa$2/
    - derive/^ts([a-z]*)ue([a-z]*)[1-9]$/ch$1oe$2/
    - derive/^ts([a-z]*)ing[1-9]$/ch$1eng/
    - derive/^ts([a-z]*)ik[1-9]$/ch$1ek/
    - derive/^ts([a-z]*)oo([a-z]*)[1-9]$/ch$1ou$2/
    - derive/^ts([a-z]+)[1-9]$/ch$1/
    - derive/^([a-z]*)ing[1-9]$/$1eng/
    - derive/^([a-z]*)ik[1-9]$/$1ek/
    - derive/^([a-z]*)ua([a-z]*)[1-9]$/$1oa$2/
    - derive/^([a-z]*)ue([a-z]*)[1-9]$/$1oe$2/
    - derive/^([a-z]*)oo([a-z]*)[1-9]$/$1ou$2/

    # === Telex 聲母簡寫：z/zh 保持 1:1，由 prism 對到 ts/tsh ===
    - derive/^tsh/zh/
    - derive/^ts/z/

    # === 進一步模糊（注意：f 已作為 Telex 音節連字符，不可有 ph/f 模糊） ===
    - derive/^j/l/
    - derive/nng/ng/
    - derive/h$//

    # === 簡拼 ===
    - abbrev/^([ptkmnbglsjhiuc]g?s?h?h?).*/$1/

translator:
  dictionary: phah_taibun
  prism: phah_taibun_telex
  enable_user_dict: true
  enable_encoder: false
  enable_sentence: true
  spelling_hints: 5
  comment_format:
    - "xform/^(.*)$/ [$1]/"

reverse_lookup:
  dictionary: terra_pinyin
  prism: bopomofo_tw
  prefix: "~"
  suffix: "'"
  tips: "〔注音反查〕"

custom_phrase:
  dictionary: ""
  user_dict: phah_taibun_custom
  db_class: stabledb
  enable_completion: false
  enable_sentence: false
  initial_quality: 1

menu:
  page_size: 10
  alternative_select_keys: "asdfghjkl;"

punctuator:
  # 完整定義（非 import_preset）：librime 1.13 對 import_preset + 本地
  # half_shape 的合併會失敗（failed to merge tree），故比照 rime-liur
  # liu_pinyin 整段定義。內容＝rime 預設 punctuation.yaml，加上自動上屏
  # 覆寫：( ) / _ < > 直接 commit。`'`（同音選字）、`[` `]`（以詞定字）、
  # `~` `?` `;` `` ` ``（反查/萬用/造詞/符號）由 recognizer/lua 先攔，
  # 這裡的映射僅為與預設行為完全相同的鍵盤層後備。
  half_shape:
    ",": { commit: "，" }
    ".": { commit: "。" }
    "<": { commit: "《" }
    ">": { commit: "》" }
    "/": { commit: "、" }
    "?": { commit: "？" }
    ";": { commit: "；" }
    ":": { commit: "：" }
    "'": { pair: ["‘", "’"] }
    "\"": { pair: ["“", "”"] }
    "\\": ["、", "\\", "＼" ]
    "|": ["·", "|", "｜", "§", "¦"]
    "`": "`"
    "~": ["~", "～"]
    "!": { commit: "！" }
    "@": "@"
    "#": "#"
    "%": ["%", "％", "°", "℃"]
    "$": ["￥", "$", "€", "£", "¥", "¢", "¤"]
    "^": { commit: "……" }
    "&": "&"
    "*": ["*", "＊", "·", "・", "×", "※", "❂"]
    "(": { commit: "（" }
    ")": { commit: "）" }
    "-": "-"
    "_": { commit: "——" }
    "+": "+"
    "=": "="
    "[": ["「", "【", "〔", "［"]
    "]": ["」", "】", "〕", "］"]
    "{": ["『", "〖", "｛"]
    "}": ["』", "〗", "｝"]
  full_shape:
    " ": { commit: "　" }
    ",": { commit: "，" }
    ".": { commit: "。" }
    "<": { commit: "《" }
    ">": { commit: "》" }
    "/": { commit: "／" }
    "?": { commit: "？" }
    ";": { commit: "；" }
    ":": { commit: "：" }
    "'": { pair: ["‘", "’"] }
    "\"": { pair: ["“", "”"] }
    "\\": ["、", "＼"]
    "|": ["·", "｜", "§", "¦"]
    "`": "｀"
    "~": "～"
    "!": { commit: "！" }
    "@": ["＠", "☯"]
    "#": ["＃", "⌘"]
    "%": ["％", "°", "℃"]
    "$": ["￥", "$", "€", "£", "¥", "¢", "¤"]
    "^": { commit: "……" }
    "&": "＆"
    "*": ["＊", "·", "・", "×", "※", "❂"]
    "(": { commit: "（" }
    ")": { commit: "）" }
    "-": "－"
    "_": { commit: "——" }
    "+": "＋"
    "=": "＝"
    "[": ["「", "【", "〔", "［"]
    "]": ["」", "】", "〕", "］"]
    "{": ["『", "〖", "｛"]
    "}": ["』", "〗", "｝"]

key_binder:
  import_preset: default
  bindings:
    - { when: always, accept: Control+space, toggle: ascii_mode }
    - { when: composing, accept: Tab, send: Shift+Right }
    - { when: composing, accept: Shift+Tab, send: Shift+Left }
    - { when: paging, accept: bracketleft, send: Page_Up }
    - { when: paging, accept: bracketright, send: Page_Down }
    # 逐字標點（移植 rime-liur）：選單開啟時 `,` `.` 維持標點鍵，不翻頁。
    # 預設 preset（paging_with_comma_period）在 has_menu 時把 period 送出
    # Page_Down、在 paging 時把 comma 送出 Page_Up；以同名 send 中和之，
    # 翻頁改用 [ ] - = PageUp PageDown。
    - { when: has_menu, accept: period, send: period }
    - { when: has_menu, accept: comma, send: comma }

recognizer:
  import_preset: default
  patterns:
    reverse_lookup: "~[a-z0-9,./;\\-]*'?$"
    symbols: "^`(e[1-9]?|[0-9]{0,2})`?$"   # ` 開啟目錄; `NN 直達分類 (尾端 ` 容錯)
    wildcard: "^[a-z]*\\?[a-z0-9]*$"
    phrase: "^;[a-z0-9]*$"

phah_taibun_select_char:
  first_key: bracketleft
  last_key: bracketright

phah_taibun_long_word:
  count: 2
  idx: 4

phah_taibun_recommend:
  enabled: true

phah_taibun_origin:
  enabled: true

# Emoji 候選（rime-emoji, LGPL-3.0；資料在 opencc/，F4 選單可開關）
emoji_conversion:
  opencc_config: emoji.json
  option_name: emoji_conversion
  tips: none
  inherit_comment: false

phah_taibun_reverse_lookup:
  tags: [ reverse_lookup ]
  overwrite_comment: true
  dictionary: phah_taibun
  comment_format:
    - "xform/^(.*)$/ [$1]/"

editor:
  bindings:
    space: confirm
    Return: commit_raw_input
    Control+Return: commit_script_text
    BackSpace: revert
    Control+BackSpace: back_syllable
    Escape: cancel
