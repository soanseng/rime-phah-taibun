  <style>
    :root {
      /* 原本 #2E8B57 對白底 4.25:1，無夠 WCAG AA 4.5:1 */
      --theme-color: #267a4c;
      --theme-color-dark: #3CB371;
    }
    .sidebar {
      background-color: #f8f8f8;
    }
    .markdown-section em {
      color: #5b6b6c;
    }
    .markdown-section h1 {
      color: var(--theme-color);
    }
    /* vue.css 的載入中畫面用 margin: 40vh，margin 會塌到 body，載好了 body 整个跳上頂（CLS 0.4）；改用 padding */
    div#app {
      margin: 0 auto;
      padding-top: 40vh;
    }
    /* 圖有 :size 寬高（先佔位，免 CLS）；窄螢幕照比例縮 */
    .markdown-section img {
      max-width: 100%;
      height: auto;
    }
    .markdown-section table {
      display: table;
      width: 100%;
    }
    .markdown-section code {
      color: #c7254e;
      background-color: #f9f2f4;
    }
    .markdown-section pre>code {
      color: inherit;
      background-color: inherit;
    }
    body.dark {
      background-color: #1e1e1e;
      color: #dcdcdc;
    }
    body.dark .sidebar {
      background-color: #252525;
    }
    body.dark .markdown-section code {
      color: #e06c75;
      background-color: #2d2d2d;
    }
    .theme-toggle {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 999;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 20px;
      cursor: pointer;
      background: var(--theme-color);
      color: white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
  </style>
  <script defer src="https://umami.anatomind.com/script.js" data-website-id="42feef16-dddc-4003-b155-19cba296c797" data-track-hash="true"></script>

<body>
  <div id="app">
    <noscript>
      <h1>寫台文使用說明</h1>
      <p>這份說明需要 JavaScript 顯示；無開的話，會當直接讀原始文件：</p>
      <ul>
        <li><a href="user-guide.md">完整使用說明（user-guide.md）</a></li>
        <li><a href="quickstart-card.md">快速上手卡</a></li>
        <li><a href="packaged-installers.md">安裝包說明</a></li>
        <li><a href="android.md">Android 安裝</a></li>
        <li><a href="tools.md">網頁工具</a></li>
      </ul>
    </noscript>
  </div>
  <button class="theme-toggle" onclick="toggleTheme()" aria-label="切換深色模式">🌙</button>
  <script>
    function toggleTheme() {
      document.body.classList.toggle('dark');
      const btn = document.querySelector('.theme-toggle');
      btn.textContent = document.body.classList.contains('dark') ? '☀️' : '🌙';
      localStorage.setItem('dark', document.body.classList.contains('dark'));
    }
    if (localStorage.getItem('dark') === 'true') {
      document.body.classList.add('dark');
      document.querySelector('.theme-toggle').textContent = '☀️';
    }
  </script>
  <script>
    window.$docsify = {
      name: '寫台文 Siá Tâi-bûn',
      logo: 'assets/img/brand-88.webp',
      repo: 'soanseng/rime-phah-taibun',
      basePath: '/',
      homepage: 'user-guide.md',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      search: {
        placeholder: '搜尋',
        noData: '找不到結果',
        paths: 'auto'
      },
      // 外掛產生的無障礙問題補正：copy-code 寫 aria-hidden="hidden"（無效值）、sidebar-collapse 的釘選鈕無名
      plugins: [function (hook) {
        // setTimeout：等後載的外掛（copy-code 等）家己的 hook 做了才補
        var patch = function () {
          setTimeout(function () {
            document.querySelectorAll('[aria-hidden="hidden"]').forEach(function (el) { el.setAttribute('aria-hidden', 'true'); });
            document.querySelectorAll('button.sidebar-pin:not([aria-label])').forEach(function (el) { el.setAttribute('aria-label', '釘選側欄'); });
          }, 0);
        };
        hook.ready(patch);
        hook.doneEach(patch);
      }]
    }
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>
</body>
