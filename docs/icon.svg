<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="寫台文 icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#04583a"/>
      <stop offset="0.5" stop-color="#079c6a"/>
      <stop offset="1" stop-color="#10e8a4"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- 配色取自 omp image 角色生成的設計稿；PNG 版（icon.png、favicon.png、icons/、Android）以源泉圓體 GenSenRounded2 TW 繪製「寫」，favicon 等 ≤64px 用 H 字重放大 -->
  <text x="512" y="530"
        text-anchor="middle"
        dominant-baseline="central"
        font-family="GenSenRounded2 TW, Noto Sans CJK TC, sans-serif"
        font-size="600"
        font-weight="700"
        fill="#ffffff">寫</text>
</svg>
