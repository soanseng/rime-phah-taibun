# trime.custom.yaml — 拍台文（Android / 同文 Trime 3.3.x）
#
# 由 scripts/build_trime_package.py 打包進 PhahTaiBun-Trime.zip；APK 路徑
# (build_apk_assets) 同時放進本檔與上游基座 trime.upstream.yaml 複本 —
# Trime 部署期由 librime 合併（ThemeManager 呼叫 deployRimeConfigFile），
# fork 的 trime.yaml 保持純上游複本。
#
# 設計（2026-09-30 使用者定案）：
#   1. 候選顯示「漢字＋拼音註解」（13sp；內建 10sp 太小）
#   2. 拍台文方案（phah_taibun / phah_taibun_telex）專用鍵盤＝上游 26 鍵
#      版面（無數字列、無功能列）：q..p 長按＝!@#$ 等符號、上滑＝數字
#      1-0；a 長按＝全選；s 上/下滑＝上/下頁；z x c v 長按＝剪/複製/貼上
#      （Trime 依方案 id 優先配對同名鍵盤，KeyboardWindow.smartMatchKeyboard）
#   3. 其他方案（嘸蝦米/注音…）完全不動＝上游原版鍵盤
#   4. 拍台文六功能改「中文(方案)鍵長按」彈出面板：
#        選字(Tab)  羅(\)  TL/POJ  漢羅/全羅  方案選單  返回
#   5. 退格鍵面改 <-
#
# 鍵名皆取自上游 trime.yaml（preset_keys、preset_keyboards）。
#
# ── 註解版面替代方案（窄螢幕）：註解改上方整列 ───────────────────
#   top 模式時 comment_height 是「註解列」高度，candidate_view_height 必須同時
#   容納 22sp 候選字與註解列。48 只是保守起點，不是保證——實際行高由 Trime 版面
#   與字型決定，請上機看候選列有沒有被裁切再微調。
#
#   把 patch 前三行換成：
#   style/comment_position: top
#   style/comment_text_size: 12
#   style/comment_height: 16
#   style/candidate_view_height: 48
#   style/candidate_padding: 8
patch:
  # ── 主題版本：bump 此值才會觸發 Trime 重新部署主題（升級路徑必備） ──
  config_version: "3.3.12-ptaibun5"

  # ── 候選註解（拼音）：對齊桌面版「漢字＋拼音」雙欄 ──
  style/comment_position: right
  style/comment_text_size: 13
  style/candidate_view_height: 30

  # ── 退格鍵面（倒退箭頭） ──
  name: 拍台文·數字列

  preset_keys/BackSpace/label: "←"

  # ── 拍台文專用鍵（行為定義在 lua/ 與 schema key_binder） ──
  preset_keys/Taigi_Tab: {label: 選字, send: Tab} #桌面 Tab: 整句連打逐詞選字 (asdf…)
  preset_keys/Taigi_Roman: {label: 羅, send: backslash} #桌面 \: 手動漢羅標記羅馬字
  preset_keys/Taigi_Poj: {label: TL/POJ, send: SWITCH_CHARSET, toggle: poj_mode, states: [TL, POJ]}
  preset_keys/Taigi_Hanlo: {label: 漢/全, send: SWITCH_CHARSET, toggle: full_romanization, states: [漢羅, 全羅]}
  preset_keys/Taigi_Menu: {label: 方案, send: MENU} #上游中文鍵長按功能，移入面板
  preset_keys/Taigi_Back: {label: 返回, send: Eisu_toggle, select: .default}
  preset_keys/Taigi_Panel: {label: 台文, send: Eisu_toggle, select: taigi_panel}

  # ── 拍台文面板（一列六鍵；寬度和 100） ──
  preset_keyboards/taigi_panel:
    name: 拍台文
    ascii_mode: 0
    width: 10
    height: 44
    lock: false
    keys:
    - {click: Taigi_Tab, width: 14}
    - {click: Taigi_Roman, width: 10}
    - {click: Page_Up, width: 12}
    - {click: Page_Down, width: 12}
    - {click: Taigi_Poj, width: 16}
    - {click: Taigi_Hanlo, width: 16}
    - {click: Taigi_Menu, width: 10}
    - {click: Taigi_Back, width: 10}

  # ── 拍台文主鍵盤＝上游 26 鍵版面＋中文鍵長按開面板 ──
  preset_keyboards/phah_taibun:
    name: 拍台文40鍵
    author: "osfans <waxaca@163.com>"
    ascii_mode: 0
    width: 10
    height: 44
    lock: true
    keys:
    - click: '1'
      long_click: '!'
    - click: '2'
      long_click: '@'
    - click: '3'
      long_click: '#'
    - click: '4'
      long_click: $
    - click: '5'
      long_click: '%'
    - click: '6'
      long_click: ^
    - click: '7'
      long_click: '&'
    - click: '8'
      long_click: '*'
    - click: '9'
      long_click: (
    - click: '0'
      long_click: )
    - click: q
      long_click: _
    - click: w
      long_click: '-'
    - click: e
      long_click: +
    - click: r
      long_click: '='
    - click: t
      long_click: '|'
    - click: y
      long_click: \
    - click: u
      long_click: '['
    - click: i
      long_click: ']'
    - click: o
      long_click: '{'
    - click: p
      long_click: '}'
    - click: a
      long_click: select_all
    - click: s
      long_click: Home
    - click: d
      long_click: End
    - click: f
      long_click: Page_Up
    - click: g
      long_click: Page_Down
    - click: h
      long_click: Left
    - click: j
      long_click: Down
    - click: k
      long_click: Up
    - click: l
      long_click: Right
    - click: ;
      long_click: ':'
    - click: z
      long_click: '`'
    - click: x
      long_click: cut
    - click: c
      long_click: copy
    - click: v
      long_click: paste
    - click: b
      long_click: '~'
    - click: n
      long_click: Insert
    - click: m
      long_click: Delete
    - click: ','
      long_click: <
    - click: .
      long_click: '>'
    - click: /
      long_click: '?'
    - click: Shift_L
    - click: Keyboard_symbols
      long_click: Keyboard_number
    - click: Mode_switch
      long_click: Taigi_Panel
    - click: space
      width: 30
    - click: "'"
      long_click: '"'
    - click: BackSpace
      width: 15
    - click: Return
      composing: Return1
      long_click: CommitComment
      width: 15
