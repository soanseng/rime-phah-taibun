# trime.custom.yaml — 拍台文（Android / 同文 Trime 3.3.x）
#
# 由 scripts/build_trime_package.py 打包進 PhahTaiBun-Trime.zip。
# Trime 以 librime 的設定機制載入 trime.yaml，本檔的 patch 會覆蓋 App 內建主題。
#
# 0.9.0 起預設生效，對齊桌面版操作：
#   1. 候選顯示「漢字＋拼音註解」（註解放大至 13sp；內建 10sp 太小）
#   2. 鍵盤底部加一列矮功能列（26 鍵 qwerty 與 40 鍵 default 都有）：
#        選字    上頁   下頁   羅    TL/POJ   漢羅/全羅
#      - 選字＝桌面 Tab：整句連打中途逐詞選字（選完用 asdf 選候選）
#      - 上頁／下頁＝桌面 [ ]：候選翻頁
#      - 羅＝桌面 \：手動漢羅模式下，把該詞改成羅馬字輸出
#      - TL/POJ、漢羅/全羅：一鍵切換輸出模式，鍵面顯示現況，
#        狀態存 user.yaml（default.custom.yaml 的 save_options），跨 session 記憶
#     想移除功能列：刪掉 preset_keyboards 段落後在 App 內重新部署。
#
# 鍵名皆取自 Trime v3.3.12 內建 trime.yaml（style 段、preset_keys、preset_keyboards）。
#
# ── 註解版面替代方案（窄螢幕）：註解改上方整列 ───────────────────
#   top 模式時 comment_height 是「註解列」高度，candidate_view_height 必須同時
#   容納 22sp 候選字與註解列。48 只是保守起點，不是保證——實際行高由 Trime 版面
#   與字型決定，請上機看候選列有沒有被裁切再微調。
#
#   把 patch 前三行換成：
#   style/comment_position: top
#   style/comment_text_size: 12
#   style/comment_height: 16
#   style/candidate_view_height: 48
#   style/candidate_padding: 8
patch:
  # ── 候選註解（拼音）：對齊桌面版「漢字＋拼音」雙欄 ──
  style/comment_position: right
  style/comment_text_size: 13
  style/candidate_view_height: 30

  # ── 拍台文專用鍵（行為定義在 lua/ 與 schema key_binder） ──
  preset_keys/Taigi_Tab: {label: 選字, send: Tab}
  preset_keys/Taigi_Roman: {label: 羅, send: backslash}
  preset_keys/Taigi_Poj: {label: TL/POJ, send: SWITCH_CHARSET, toggle: poj_mode, states: [TL, POJ]}
  preset_keys/Taigi_Hanlo: {label: 漢/全, send: SWITCH_CHARSET, toggle: full_romanization, states: [漢羅, 全羅]}

  # ── 功能列（矮列 34）：26 鍵 qwerty ──
  preset_keyboards/qwerty/keys/@next: {click: Taigi_Tab, height: 34, width: 22}
  preset_keyboards/qwerty/keys/@next 1: {click: Page_Up, height: 34, width: 13}
  preset_keyboards/qwerty/keys/@next 2: {click: Page_Down, height: 34, width: 13}
  preset_keyboards/qwerty/keys/@next 3: {click: Taigi_Roman, height: 34, width: 13}
  preset_keyboards/qwerty/keys/@next 4: {click: Taigi_Poj, height: 34, width: 19.5}
  preset_keyboards/qwerty/keys/@next 5: {click: Taigi_Hanlo, height: 34, width: 19.5}

  # ── 功能列（矮列 34）：40 鍵 default（含數字列，方便聲調） ──
  preset_keyboards/default/keys/@next: {click: Taigi_Tab, height: 34, width: 22}
  preset_keyboards/default/keys/@next 1: {click: Page_Up, height: 34, width: 13}
  preset_keyboards/default/keys/@next 2: {click: Page_Down, height: 34, width: 13}
  preset_keyboards/default/keys/@next 3: {click: Taigi_Roman, height: 34, width: 13}
  preset_keyboards/default/keys/@next 4: {click: Taigi_Poj, height: 34, width: 19.5}
  preset_keyboards/default/keys/@next 5: {click: Taigi_Hanlo, height: 34, width: 19.5}
