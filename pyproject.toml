[project]
name = "rime-phah-taibun"
version = "0.11.0"
description = "寫台文 — 基於 Rime 的台語輸入法方案，資料前處理工具"
requires-python = ">=3.10"
dependencies = [
    "opencc>=1.4.2",
    "pyyaml>=6.0",
    "ruamel-yaml>=0.18",
]

[dependency-groups]
dev = [
    "ruff>=0.14",
    "pytest>=8.0",
    "pytest-cov>=6.0",
]

[tool.ruff]
target-version = "py310"
line-length = 120
# 讀台文 (docs/thak) 併入的 vendored 工具: 保留原作風格, 毋套本專案 lint/format
extend-exclude = ["scripts/thak"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_rime: 真 librime 整合測試（g++ 編譯＋部署 220K 字典，84 條 15+ 分鐘）；日常迴圈預設跳過，全套驗證用 -m real_rime",
    "e2e: 瀏覽器擴充功能真 Chromium e2e（playwright）；日常迴圈預設跳過，驗證用 uv run --with playwright pytest -m e2e",
]
addopts = "-m 'not real_rime and not e2e'"
